<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<h:head>
    <title>Conversation Jakarta EE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <h:outputStylesheet library="css" name="mycsslayout.css" />
    <h:outputScript library="js" name="script.js" target="body" />
</h:head>
<h:body>
<main class="app-shell">
    <h:form id="chatForm" styleClass="chat-form">
        <header class="topbar">
            <div class="brand"><span class="brand-mark">✦</span><div><strong>Assistant de conversation</strong><small>TP 0 · Jakarta EE, CDI et JSF</small></div></div>
            <p:commandButton value="＋ Nouveau chat" action="#{bb.nouveauChat}" update="@form" process="@this" resetValues="true" styleClass="new-chat" />
        </header>
        <section class="welcome">
            <span class="eyebrow">CONVERSATION</span>
            <h1>Posez votre question</h1>
            <p>Choisissez le rôle de l’API. Il reste fixé jusqu’au prochain chat.</p>
        </section>
        <h:messages id="messages" showDetail="true" styleClass="ui-messages" />
        <div class="workspace">
            <section class="question-panel">
                <div class="role-row">
                    <h:outputLabel for="role" value="Rôle de l’API" />
                    <p:selectOneMenu id="role" value="#{bb.role}" disabled="#{bb.roleSystemeAffiche}" styleClass="role-select">
                        <f:selectItem itemLabel="Choisir un rôle…" itemValue="" noSelectionOption="true" />
                        <f:selectItems value="#{bb.roles}" />
                    </p:selectOneMenu>
                </div>
                <div class="field-heading"><h:outputLabel for="question" value="Votre question" /><p:commandButton type="button" value="Copier" onclick="copyText('chatForm:question')" styleClass="copy-button" /></div>
                <p:inputTextarea id="question" value="#{bb.question}" rows="5" autoResize="false" maxlength="2000" placeholder="Écrivez votre question…" styleClass="text-area" />
                <p:commandButton value="Envoyer la question  →" action="#{bb.envoyer}" update="messages question response history role" process="@form" styleClass="send-button" />
                <div class="field-heading response-heading"><h:outputLabel for="response" value="Réponse" /><p:commandButton type="button" value="Copier" onclick="copyText('chatForm:response')" styleClass="copy-button" /></div>
                <p:inputTextarea id="response" value="#{bb.reponse}" rows="5" autoResize="false" readonly="true" styleClass="text-area response-area" />
            </section>
            <aside class="history-panel">
                <div class="field-heading"><h:outputLabel for="history" value="Historique de la conversation" /><p:commandButton type="button" value="Copier" onclick="copyText('chatForm:history')" styleClass="copy-button" /></div>
                <p:inputTextarea id="history" value="#{bb.historique}" rows="20" autoResize="false" readonly="true" styleClass="text-area history-area" />
                <p:commandButton value="Effacer l’historique" action="#{bb.effacerHistorique}" update="history" process="@this" styleClass="clear-button" />
            </aside>
        </div>
    </h:form>
    <footer>Les réponses sont générées à titre indicatif.</footer>
</main>
</h:body>
</html>
